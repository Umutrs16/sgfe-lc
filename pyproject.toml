[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sgfe-lc"
version = "0.1.0"
description = "Stability-gated foundation-embedding land-cover mapping for arid Central Asia"
requires-python = ">=3.10"
dependencies = [
  "earthengine-api>=1.5.0",
  "geopandas>=1.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "xgboost>=2.0",
  "scipy>=1.13",
  "shap>=0.46",
  "matplotlib>=3.9",
  "openpyxl>=3.1",
  "pyproj>=3.6",
]

[tool.setuptools.packages.find]
where = ["src"]
